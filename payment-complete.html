<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment - Align'd Wellness</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F8F5F1;
      color: #3D3028;
      line-height: 1.7;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
    }
    .header {
      background: linear-gradient(135deg, #E9CFC8, #CFA7A0);
      padding: 48px 24px 40px;
      text-align: center;
    }
    .header h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 36px;
      font-weight: 500;
      color: #fff;
      margin-bottom: 8px;
    }
    .header p {
      color: rgba(255,255,255,0.85);
      font-size: 14px;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 24px 64px;
    }
    h2 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 26px;
      font-weight: 500;
      color: #3D3028;
      margin: 36px 0 14px;
    }
    h3 {
      font-family: 'Hanken Grotesk', sans-serif;
      font-size: 16px;
      font-weight: 600;
      color: #3D3028;
      margin: 24px 0 10px;
    }
    p { margin-bottom: 14px; }
    ul, ol {
      margin: 0 0 14px 20px;
    }
    li { margin-bottom: 6px; }
    a { color: #9E7A72; text-decoration: underline; }
    a:hover { color: #CFA7A0; }
    .effective {
      display: inline-block;
      background: #EDE3D8;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      color: #6E6058;
      margin-bottom: 24px;
    }
    .footer {
      text-align: center;
      padding: 32px 24px;
      border-top: 1px solid #E4D8CE;
      font-size: 13px;
      color: #9E8E82;
    }
    .footer a { color: #9E7A72; }
    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: 500;
      color: #9E7A72;
      text-decoration: none;
    }
    .back-link:hover { text-decoration: underline; }
      .box { text-align: center; padding: 56px 0; }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="title">Thank you</h1>
  </div>
  <div class="container">
    <div class="box">
      <p id="msg">Your payment is being confirmed. You can go back to the Align'd app &mdash; it updates by itself.</p>
      <p class="small" style="font-size:13px;color:#9E8E82">Tap <strong>Done</strong> at the top if this page is still open.</p>
    </div>
  </div>
  <script>
    // Stripe sends people here after checkout. The order is only marked paid
    // once Stripe's signed webhook reaches our server, which the app waits for.
    const status = new URLSearchParams(location.search).get('status');
    if (status === 'cancelled') {
      document.getElementById('title').textContent = 'Payment cancelled';
      document.getElementById('msg').textContent = "Nothing was charged. You can go back to the Align'd app and try again.";
    }
  </script>
</body>
</html>
